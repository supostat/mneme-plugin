# Push/PR gate plus the main-branch auto patch-bump.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Manifest, pin and launcher gates
        run: npm test

      - name: Launcher is shellcheck-clean
        run: shellcheck plugin/bin/launch.sh

      - name: Design-server launcher is shellcheck-clean
        run: shellcheck plugin/scripts/design-server.sh

      - name: Release pin integrity (silently skipped while no pin exists)
        run: node scripts/check-release-integrity.mjs plugin/bin/release.json --allow-missing

  auto-bump:
    # The actor guard breaks the loop: a bump commit pushed by the bot must
    # never trigger another bump of itself.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch-bump every bundle changed since its version base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bump_subject="$(node scripts/auto-bump.mjs)"
          if [ -n "$bump_subject" ]; then
            echo "$bump_subject"
            git push origin main
          fi
